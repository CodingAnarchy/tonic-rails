[package]
name = "tonic-bench-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tonic-bench-server"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
debug = true
