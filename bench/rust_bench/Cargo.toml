[package]
name = "tonic-bench-rust"
version = "0.1.0"
edition = "2024"
publish = false

# Pure-Rust tonic implementation of bench.v1.BenchService, used as the
# baseline for tonic-rails (see PERF.md).

[[bin]]
name = "tonic-bench-server"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
