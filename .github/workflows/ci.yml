name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRPCURL_VERSION: v1.9.3
  PROTOC_VERSION: "32.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
          rustup-components: rustfmt, clippy
      - name: RuboCop
        run: bundle exec rubocop
      - name: rustfmt + clippy
        run: bundle exec rake cargo:lint

  test:
    name: test (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - os: windows-latest
            ruby: "3.4"
    steps:
      - uses: actions/checkout@v7
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install grpcurl (reflection specs)
        run: |
          go install "github.com/fullstorydev/grpcurl/cmd/grpcurl@${GRPCURL_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install protoc (generator specs)
        run: |
          case "$RUNNER_OS" in
            Linux)
              # Ubuntu's package is protoc 3.21, too old for google-protobuf 4.
              curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
                "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
              sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
              ;;
            macOS) brew install protobuf ;;
            *) echo "skipping on $RUNNER_OS; the generator specs that need protoc will be skipped" ;;
          esac
      - name: Compile native extension
        run: bundle exec rake compile
      - name: Rust unit tests
        run: bundle exec rake cargo:test
      - name: Specs
        run: bundle exec rspec

  package:
    name: package (build, install from source, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - name: Build gem
        run: gem build tonic-rails.gemspec -o tonic-rails.gem
      - name: Install into an empty GEM_HOME (compiles the extension)
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems"
          gem install --no-document ./tonic-rails.gem
          cd "$RUNNER_TEMP"
          ruby -e 'require "tonic-rails"; Tonic::Rails.native_extension!; puts "native extension loaded"'
      - name: Example app boots
        working-directory: example
        run: |
          bundle install
          bin/rails tonic_rails:routes | grep -q "/demo.v1.ItemService/GetItem"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: bundler-audit
        run: bundle exec bundle-audit check --update
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # Latest patched Go, so standard-library advisories reflect a current toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: govulncheck (benchmark client)
        working-directory: bench/go_bench
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  bench:
    name: bench (builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bench/go_bench/go.mod
          cache-dependency-path: bench/go_bench/go.sum
      - name: Go client
        working-directory: bench/go_bench
        run: go vet ./... && go build ./...
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Rust reference server
        working-directory: bench/rust_bench
        run: cargo build --locked
