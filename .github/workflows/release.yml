name: Release

# Push a tag matching the gem version (e.g. v0.1.0) to build the source
# gem plus precompiled native gems, smoke-test them, and publish to
# RubyGems via Trusted Publishing.
on:
  push:
    tags: ["v*"]
  # Manual runs build and test the gems without publishing.
  workflow_dispatch:

permissions:
  contents: read

env:
  RUBY_VERSIONS: "3.2,3.3,3.4,4.0"

jobs:
  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -Ilib -e 'require "tonic/rails/version"; print Tonic::Rails::VERSION')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: gem build tonic-rails.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: "*.gem"
          if-no-files-found: error

  native-gems:
    name: native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
          cargo-vendor: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ env.RUBY_VERSIONS }}
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  test-native-gems:
    name: test native gem (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    needs: native-gems
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux-gnu, ruby: "3.2" }
          - { os: ubuntu-latest, platform: x86_64-linux-gnu, ruby: "4.0" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-gnu, ruby: "3.4" }
          - { os: macos-latest, platform: arm64-darwin, ruby: "3.3" }
          - { os: macos-latest, platform: arm64-darwin, ruby: "4.0" }
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v5
        with:
          name: gem-${{ matrix.platform }}
      - name: Install without a Rust toolchain and load the extension
        run: |
          gem install --no-document --local tonic-rails-*.gem || gem install --no-document tonic-rails-*.gem
          ruby -e 'require "tonic-rails"; Tonic::Rails.native_extension!; s = TonicRails::Native::Server.new("127.0.0.1:0", 1024); puts "ok: #{s.class}"'

  publish:
    needs: [source-gem, test-native-gems]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # GitHub release
      id-token: write # RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push gems
        run: |
          ls -l pkg
          for gem in pkg/*.gem; do gem push "$gem"; done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pkg/*.gem --title "${GITHUB_REF_NAME}" --notes "See [CHANGELOG.md](CHANGELOG.md)."
