name: Release

# Push a tag matching the gem version (e.g. v0.1.0) to build the source
# gem plus precompiled native gems, smoke-test them, and publish to
# RubyGems via Trusted Publishing.  Pull requests that touch the native
# build (and manual runs) build and test the gems without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.*"
      - "Rakefile"
      - "ext/**"
      - "tonic-rails.gemspec"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  RUBY_VERSIONS: "3.3,3.4,4.0"

jobs:
  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -Ilib -e 'require "tonic/rails/version"; print Tonic::Rails::VERSION')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: gem build tonic-rails.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: "*.gem"
          if-no-files-found: error

  native-gems:
    name: native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          # Gems built on the runner would be mounted into the container,
          # whose older glibc cannot load them; the container bundles itself.
          bundler-cache: false
          cargo-cache: true
          cargo-vendor: true
      # Use the rb-sys-dock image matching the locked rb_sys (otherwise the
      # tool falls back to the gemspec's minimum, whose image lacks newer Rubies).
      - name: rb-sys-dock image tag
        id: rb-sys
        run: echo "version=$(grep -oE '^    rb_sys \([0-9.]+\)' Gemfile.lock | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ env.RUBY_VERSIONS }}
          tag: ${{ steps.rb-sys.outputs.version }}
          # rb-sys-dock images carry the Rust that was stable when they
          # were built; the crate (and tonic 0.14) need edition 2024 / Rust
          # 1.88+, so install current stable for the image's target first.
          pre-script: rustup toolchain install stable --profile minimal --target "$RUST_TARGET" && rustup default stable
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  test-native-gems:
    name: test native gem (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    needs: native-gems
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux-gnu, ruby: "3.3" }
          - { os: ubuntu-latest, platform: x86_64-linux-gnu, ruby: "4.0" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-gnu, ruby: "3.4" }
          - { os: macos-latest, platform: arm64-darwin, ruby: "3.3" }
          - { os: macos-latest, platform: arm64-darwin, ruby: "4.0" }
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v5
        with:
          name: gem-${{ matrix.platform }}
      - name: Install without a Rust toolchain and load the extension
        run: |
          gem install --no-document tonic-rails-*.gem
          gem list tonic-rails
          ruby -e 'require "tonic-rails"; Tonic::Rails.native_extension!; s = TonicRails::Native::Server.new("127.0.0.1:0", 1024); puts "ok: #{s.class}"'

  publish:
    needs: [source-gem, test-native-gems]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # GitHub release
      id-token: write # RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push gems
        run: |
          ls -l pkg
          for gem in pkg/*.gem; do gem push "$gem"; done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pkg/*.gem --title "${GITHUB_REF_NAME}" --notes "See [CHANGELOG.md](CHANGELOG.md)."
