syntax = "proto3";

package shop;

// Realistic e-commerce product service for benchmarking.
// Exercises: scalar fields, enums, repeated fields, nested messages,
// batch patterns, validation-style error paths, and multi-query handlers
// that simulate real Rails controller complexity.
service ProductService {
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc BatchGetProducts(BatchGetProductsRequest) returns (BatchGetProductsResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  // Realistic "show page" — 3 sequential DB queries + CPU work
  rpc GetProductDetail(GetProductDetailRequest) returns (GetProductDetailResponse);
  // Realistic "search" — 1 slow query + CPU facets + 1 secondary query
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  // Realistic "checkout" — 4 sequential DB queries + price calculation
  rpc CheckoutPreview(CheckoutPreviewRequest) returns (CheckoutPreviewResponse);
  // Realistic "dashboard" — 3 slow aggregate queries + stat aggregation
  rpc Dashboard(DashboardRequest) returns (DashboardResponse);
}

message Product {
  int64 id = 1;
  string title = 2;
  string description = 3;
  int64 price_cents = 4;
  string currency = 5;
  repeated string tags = 6;
  ProductStatus status = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

message GetProductRequest {
  int64 id = 1;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string tag_filter = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message CreateProductRequest {
  string title = 1;
  string description = 2;
  int64 price_cents = 3;
  string currency = 4;
  repeated string tags = 5;
}

message BatchGetProductsRequest {
  repeated int64 ids = 1;
}

message BatchGetProductsResponse {
  repeated Product products = 1;
  repeated int64 not_found_ids = 2;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string service = 2;
}

// ── Realistic handler RPCs ─────────────────────────────────────────

message Review {
  int64 id = 1;
  int64 product_id = 2;
  int32 rating = 3;
  string author = 4;
  string body = 5;
  int64 created_at_unix = 6;
}

message GetProductDetailRequest {
  int64 id = 1;
}

message GetProductDetailResponse {
  Product product = 1;
  repeated Review reviews = 2;
  repeated Product related_products = 3;
}

message SearchProductsRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
  int64 min_price_cents = 4;
  int64 max_price_cents = 5;
  string tag_filter = 6;
}

message SearchProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
  int32 query_time_ms = 3;
}

message CheckoutItem {
  Product product = 1;
  int32 quantity = 2;
  int64 unit_price_cents = 3;
  int64 line_total_cents = 4;
}

message CheckoutPreviewRequest {
  int64 user_id = 1;
  repeated CartItem cart_items = 2;
}

message CartItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message CheckoutPreviewResponse {
  repeated CheckoutItem items = 1;
  int64 subtotal_cents = 2;
  int64 shipping_cents = 3;
  int64 tax_cents = 4;
  int64 total_cents = 5;
}

message DashboardRequest {
  int64 user_id = 1;
}

message DashboardResponse {
  int32 total_orders = 1;
  int64 total_revenue_cents = 2;
  int64 avg_order_value_cents = 3;
  int32 recent_product_count = 4;
  int32 active_product_count = 5;
  repeated Product top_products = 6;
}
