[package]
name = "tonic_rails_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

# Magnus bridges Rust ↔ Ruby.  rb-sys provides the raw Ruby FFI
# (including the GVL coordination functions).  tonic supplies the
# gRPC transport layer (HTTP/2, TLS, keepalive, graceful shutdown).
# tonic-reflection and tonic-health provide built-in gRPC reflection
# (v1) and health-check services as sibling routes.
#
# The dispatch model is raw-byte passthrough: every path that is not
# health or reflection falls through to a generic tower Service that
# unframes the gRPC message, sends raw bytes to Ruby via the GVL bridge,
# and frames the response.  No protobuf decode/encode on the hot path,
# and no service definitions are compiled into the extension — routes
# are registered from Ruby at runtime.
#
# socket2 enables SO_REUSEPORT for multi-process (Puma worker) scaling.
[dependencies]
magnus = "0.8"
rb-sys = "0.9"
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "server", "tls-ring"] }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
tonic-health = { version = "0.14", default-features = false }
axum = { version = "0.8", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14"
prost-types = "0.14"
socket2 = { version = "0.6", features = ["all"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
flate2 = { version = "1", features = ["rust_backend"] }
